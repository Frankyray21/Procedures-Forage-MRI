# Publie DEUX sites sur GitHub Pages :
#   OFFICIEL (branche main, le lien partagé aux équipes — ne bouge que sur décision) :
#     https://frankyray21.github.io/Procedures-Forage-MRI/
#   TEST (branche test, le travail en cours) :
#     https://frankyray21.github.io/Procedures-Forage-MRI/test/
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "test"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Site officiel (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Site de test (branche test, sous /test/)
        uses: actions/checkout@v4
        continue-on-error: true   # tant que la branche test n'existe pas
        with:
          ref: test
          path: site/test
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
