# Compile l'app Android (APK) avec tout le contenu embarqué.
#
# DEUX CANAUX :
#   TEST (automatique, à chaque poussée sur main) — app distincte
#   « Procédures MRI (TEST) », installable à côté de l'officielle :
#     https://github.com/Frankyray21/Procedures-Forage-MRI/releases/download/apk-test/procedures-mri-test.apk
#   OFFICIEL (sur décision seulement : lancer ce workflow à la main avec
#   channel=production) — le lien/QR déjà partagés, JAMAIS mis à jour
#   automatiquement pendant une phase de test :
#     https://github.com/Frankyray21/Procedures-Forage-MRI/releases/download/apk-latest/procedures-mri.apk
name: Build Android APK

# La branche « test » porte le travail en cours (site de test + APK de test) ;
# « main » est la version OFFICIELLE (site partagé + APK officiel), mise à jour
# seulement sur décision (fusion test -> main, puis dispatch production).
on:
  push:
    branches: ["test"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal de publication"
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: write   # publier la release et son APK
  actions: write    # redéclencher le déploiement Pages (site de test)

# Pas d'annulation en cours de route : un run annulé pendant la publication
# laisserait la release sans APK (lien de téléchargement en 404).
concurrency:
  group: "apk"
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le site de test (github.io/…/test/) est publié par static.yml, qui ne
      # peut tourner que depuis main (protection de l'environnement Pages) :
      # on le redéclenche donc d'ici à chaque poussée sur la branche test.
      - name: Redéployer le site de test
        if: github.ref == 'refs/heads/test'
        run: gh workflow run static.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm ci

      - name: Assembler le contenu embarqué (apk/www)
        run: node apk/build-www.js

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Lire la version du site et choisir le canal
        id: ver
        run: |
          V=$(grep -oP '\?v=\K\d+' index.html | head -1)
          NAME=$(grep -oP '>v\K[0-9]+\.[0-9]+' index.html | head -1)
          if [ -z "$V" ] || [ -z "$NAME" ]; then
            echo "Version introuvable dans index.html (?v= ou vX.YY) — arrêt."
            exit 1
          fi
          CHANNEL="${{ github.event.inputs.channel }}"
          if [ -z "$CHANNEL" ]; then CHANNEL=test; fi   # push automatique = canal TEST
          echo "code=$V" >> "$GITHUB_OUTPUT"
          echo "name=v$NAME" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK signé
        working-directory: android
        run: |
          chmod +x gradlew
          EXTRA=""
          if [ "${{ steps.ver.outputs.channel }}" = "test" ]; then EXTRA="-PtestChannel=true"; fi
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            $EXTRA

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          if [ "${{ steps.ver.outputs.channel }}" = "test" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/procedures-mri-test.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk dist/procedures-mri.apk
          fi
          ls -lh dist

      - name: Publier (canal TEST)
        if: steps.ver.outputs.channel == 'test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test
          name: "App Android TEST — Procédures MRI (${{ steps.ver.outputs.name }})"
          prerelease: true
          body: |
            **Version de TEST** — s'installe à côté de l'app officielle
            (icône « Procédures MRI (TEST) »). Ne pas distribuer aux équipes.

            Contenu : ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})
          files: dist/procedures-mri-test.apk

      - name: Publier (canal OFFICIEL)
        if: steps.ver.outputs.channel == 'production'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "App Android — Procédures MRI (${{ steps.ver.outputs.name }})"
          body: |
            APK de l'app **Procédures de forage MRI** avec tout le contenu embarqué
            (fiches, images, PDF, quiz) — fonctionne sous terre dès l'installation.

            Contenu : ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})

            **Installation** : télécharger `procedures-mri.apk` sur le téléphone,
            l'ouvrir, accepter « installer des applications de cette source ».
            Les mises à jour de contenu (quiz, textes) arrivent ensuite toutes
            seules quand il y a du réseau ; réinstaller l'APK seulement quand
            l'app le recommande (nouvelles images ou nouveaux PDF).
          files: dist/procedures-mri.apk
